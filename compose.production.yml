services:
  caddy:
    image: ghcr.io/lvckyapi/caddy-maintenance-proxy:latest
    container_name: "${PROJECT_NAME:-maintenance_proxy}_caddy"
    restart: unless-stopped
    environment:
      CADDY_UPSTREAM: ${CADDY_UPSTREAM:-https://www.e-recht24.de}
      CADDY_UPSTREAM_PATH: ${CADDY_UPSTREAM_PATH:-/}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME:-maintenance_proxy}_caddy.rule=PathPrefix(`/`)"
      - "traefik.http.routers.${PROJECT_NAME:-maintenance_proxy}_caddy.entrypoints=https"
      - "traefik.http.routers.${PROJECT_NAME:-maintenance_proxy}_caddy.tls=true"
      - "traefik.http.routers.${PROJECT_NAME:-maintenance_proxy}_caddy.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${PROJECT_NAME:-maintenance_proxy}_caddy.priority=1000000"
      - "traefik.http.services.${PROJECT_NAME:-maintenance_proxy}_caddy.loadbalancer.server.port=80"
    networks:
      - traefik-proxy

networks:
  traefik-proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-proxy}
